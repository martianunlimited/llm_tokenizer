[project]
name = "llm-tokenization-demo"
version = "0.1.0"
description = "Interactive LLM Tokenization Demo for GitHub Pages exploring token bias, minority languages, and token collisions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tiktoken>=0.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
